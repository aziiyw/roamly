<!doctype html>
<html><head><meta charset="utf-8"><title>Final Test with Real Image</title></head>
<body>
<h2>Final Scan Test — Using YOUR Actual Screenshot</h2>
<p>This tests analyzeImageClientSide with the real screenshot image that was failing before.</p>
<button id="run">Run test with real screenshot</button>
<pre id="log" style="background:#f0f0f0;padding:16px;font-size:13px;max-height:600px;overflow:auto;white-space:pre-wrap;"></pre>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
const log = document.getElementById('log');
function out(msg) { log.textContent += msg + '\n'; log.scrollTop = log.scrollHeight; }

document.getElementById('run').addEventListener('click', async () => {
  log.textContent = '=== Final Test with Real Screenshot ===\n\n';
  out('1. Loading your actual screenshot image...');

  // Fetch the user's real screenshot
  try {
    const resp = await fetch('screenshot.png');
    if (!resp.ok) throw new Error('screenshot.png not found');
    const blob = await resp.blob();
    out('   image loaded: ' + blob.size + ' bytes, type: ' + blob.type);

    // Convert to data URL with FileReader (exactly like app.js)
    const reader = new FileReader();
    reader.onload = async () => {
      out('2. FileReader onload: ' + reader.result.length + ' chars');
      out('3. Calling analyzeImageClientSide...');
      const start = performance.now();
      try {
        const analysis = await analyzeImageClientSide(reader.result);
        const elapsed = ((performance.now() - start) / 1000).toFixed(1);
        out('   ✅ SUCCESS in ' + elapsed + 's');
        out('   translation: ' + JSON.stringify(analysis.translation));
        out('   detectedText: ' + JSON.stringify(analysis.detectedText));
        out('   romanisation: ' + JSON.stringify(analysis.romanisation));
        out('   vocabulary: ' + (analysis.vocabulary?.length || 0) + ' words');
        if (analysis.vocabulary) {
          analysis.vocabulary.forEach(v => {
            out('     • ' + v.word + ' (' + (v.reading||'') + ') = ' + (v.meaning||''));
          });
        }
        out('\n🎉 THE FIX WORKS WITH YOUR REAL IMAGE!');
      } catch (err) {
        const elapsed = ((performance.now() - start) / 1000).toFixed(1);
        out('   ❌ FAILED after ' + elapsed + 's');
        out('   ' + err.name + ': ' + err.message);
      }
    };
    reader.readAsDataURL(blob);
  } catch (e) {
    out('Could not load screenshot.png: ' + e.message);
    out('Trying with canvas-generated image instead...');
  }
});
</script>
</body>
</html>
