<!doctype html>
<html><head><meta charset="utf-8"><title>Scan Flow Test</title></head>
<body>
<h2>Scan Flow Test</h2>
<p>This replicates the EXACT flow app.js uses: FileReader → analyzeImageClientSide.</p>
<button id="run">Run scan test</button>
<pre id="log" style="background:#f0f0f0;padding:16px;font-size:13px;max-height:600px;overflow:auto;"></pre>
<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>
<script>
// We have access to analyzeImageClientSide, data, state from app.js
const log = document.getElementById('log');
function out(msg) {
  log.textContent += msg + '\n';
  log.scrollTop = log.scrollHeight;
}

document.getElementById('run').addEventListener('click', async () => {
  log.textContent = '';
  out('=== Scan Flow Diagnostic ===\n');

  // Step 1: Create a test image (simulates a photo upload)
  out('1. Creating test image with Japanese text...');
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 400, 200);
  ctx.fillStyle = '#000000';
  ctx.font = '48px sans-serif';
  ctx.fillText('出口', 120, 110);
  ctx.font = '20px sans-serif';
  ctx.fillText('deguchi - Exit', 100, 160);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  out('   blob created: ' + blob.size + ' bytes, type: ' + blob.type);

  // Step 2: Convert to data URL using FileReader (exactly like app.js)
  out('2. Reading with FileReader (like app.js uploadTravelImage)...');
  const reader = new FileReader();
  reader.onload = async () => {
    out('   FileReader.onload fired');
    out('   result type: ' + typeof reader.result);
    out('   result starts with: ' + reader.result.slice(0, 30));
    out('   result length: ' + reader.result.length);

    // Step 3: Call analyzeImageClientSide (exactly like app.js line 186)
    out('3. Calling analyzeImageClientSide(reader.result)...');
    const start = performance.now();
    try {
      out('   calling fetch to GLM...');
      const analysis = await analyzeImageClientSide(reader.result);
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      out('   ✅ SUCCESS in ' + elapsed + 's');
      out('   translation: ' + JSON.stringify(analysis.translation));
      out('   detectedText: ' + JSON.stringify(analysis.detectedText));
      out('   vocabulary count: ' + (analysis.vocabulary?.length || 0));
      out('\n🎉 The scan flow works! If this test works but the real app does not,');
      out('   the issue is in how the real upload triggers, not in the GLM call.');
    } catch (err) {
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      out('   ❌ FAILED after ' + elapsed + 's');
      out('   Error name: ' + err.name);
      out('   Error message: ' + err.message);
      out('   Error stack: ' + (err.stack || '(none)'));
    }
  };
  reader.onerror = (e) => {
    out('   ❌ FileReader error: ' + e);
  };
  reader.readAsDataURL(blob);
  out('   reader.readAsDataURL called, waiting for onload...\n');
});
</script>
</body>
</html>
