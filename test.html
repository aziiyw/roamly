<!doctype html>
<html><head><meta charset="utf-8"><title>Test</title></head>
<body>
<button id="run">Upload & Scan</button>
<pre id="log" style="background:#eee;padding:16px;font-size:12px;white-space:pre-wrap;"></pre>
<div id="app"></div>
<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
<script>
document.getElementById('run').addEventListener('click', async () => {
  const log = document.getElementById('log');
  log.textContent = 'Fetching image...\n';
  const resp = await fetch('test.png');
  const blob = await resp.blob();
  const file = new File([blob], 'test.png', { type: 'image/png' });
  const fakeInput = { files: [file], dataset: { uploadMode: 'learn' } };

  // Patch render to log
  const origRender = window.render;
  window.render = function() {
    try {
      const views = { welcome, setup, modeChoice, home: dashboard, scan, result, loading, scanError, vocab, trip, quiz };
      log.textContent += '[render] screen=' + state.screen + ' analysis=' + (state.analysis ? 'SET' : 'null') + '\n';
      views[state.screen]();
      log.textContent += '[render] OK\n';
    } catch(e) {
      log.textContent += '[render] THREW: ' + e.message + '\n' + (e.stack||'').split('\n').slice(0,4).join('\n') + '\n';
    }
  };

  log.textContent += 'Calling uploadTravelImage...\n';
  uploadTravelImage(fakeInput, 'learn');
  await new Promise(r => setTimeout(r, 30000));
  log.textContent += '\nFinal screen: ' + state.screen + '\n';
  log.textContent += 'Translation: ' + (state.analysis?.translation || 'none') + '\n';
});
</script>
</body>
</html>
