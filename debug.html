<!doctype html>
<html>
<head><meta charset="utf-8"><title>Roamly GLM Connection Test</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
  button { padding: 12px 20px; font-size: 16px; cursor: pointer; margin: 8px 0; }
  #log { white-space: pre-wrap; background: #f4f4f4; padding: 16px; border-radius: 8px;
         font-family: monospace; font-size: 13px; max-height: 500px; overflow: auto; }
  .ok { color: #080; } .err { color: #c00; } .info { color: #006; }
</style>
</head>
<body>
<h1>Roamly GLM Connection Test</h1>
<p>This page makes the exact same GLM API call that Roamly's Scan feature makes. It will show us exactly what's happening.</p>
<button id="run">Run test (creates a tiny test image)</button>
<button id="upload">Upload your own photo</button>
<input type="file" id="file" accept="image/*" hidden>
<div id="log">Click "Run test" to start.</div>
<script src="config.js"></script>
<script>
const log = document.getElementById('log');
function out(msg, cls) {
  const span = document.createElement('span');
  span.className = cls || '';
  span.textContent = msg + '\n';
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}
function clearLog() { log.innerHTML = ''; }

async function testGLM(dataUrl) {
  clearLog();
  out('=== Roamly GLM Connection Test ===', 'info');
  out('');

  // 1. Check config
  const config = window.ROAMLY_CONFIG || {};
  out('1. CONFIG CHECK');
  out('   glmEndpoint: ' + (config.glmEndpoint || '(missing)'));
  out('   glmModel: ' + (config.glmModel || '(missing)'));
  out('   glmApiKey: ' + (config.glmApiKey ? config.glmApiKey.slice(0,6) + '…(' + config.glmApiKey.length + ' chars)' : '(missing)'));
  if (!config.glmApiKey || config.glmApiKey.includes('PASTE-YOUR')) {
    out('   ❌ KEY NOT SET — config.js still has the placeholder', 'err');
    return;
  }
  out('   ✅ key looks set', 'ok');
  out('');

  // 2. Build request (identical to app.js analyzeImageClientSide)
  const prompt = `You are Roamly, a kind travel-language companion. Analyse a photo containing foreign-language text. Return ONLY valid JSON with this exact shape:
{"detectedText":"...","translation":"...","romanisation":"...","naturalNote":"...","vocabulary":[]}`;
  out('2. BUILDING REQUEST');
  out('   image data URL length: ' + dataUrl.length + ' chars');
  out('   endpoint: ' + config.glmEndpoint);
  out('   model: ' + config.glmModel);
  out('');

  // 3. Make the call
  out('3. CALLING GLM (this may take 5-30s for a real photo)...', 'info');
  const start = performance.now();
  try {
    const resp = await fetch(config.glmEndpoint, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + config.glmApiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: config.glmModel || 'glm-5v-turbo',
        messages: [{ role: 'user', content: [
          { type: 'image_url', image_url: { url: dataUrl } },
          { type: 'text', text: prompt }
        ]}],
        thinking: { type: 'disabled' },
        temperature: 0.2
      })
    });
    const elapsed = ((performance.now() - start) / 1000).toFixed(1);
    out('   HTTP status: ' + resp.status + ' (in ' + elapsed + 's)');

    // Check CORS headers (if present)
    const aco = resp.headers.get('access-control-allow-origin');
    out('   access-control-allow-origin: ' + (aco || '(not exposed / none)'));

    const text = await resp.text();
    out('   response body length: ' + text.length + ' chars');
    out('');
    out('4. RAW RESPONSE:');
    out(text.slice(0, 1000));
    out('');

    if (!resp.ok) {
      out('❌ GLM returned an error status (' + resp.status + ')', 'err');
      out('   This means the key works but GLM rejected the request.', 'err');
      out('   Common causes: content filter flagged the image, image too large, or model issue.', 'err');
      return;
    }

    // 5. Parse like app.js does
    out('5. PARSING RESPONSE (like app.js does)');
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      out('   ❌ Outer JSON.parse failed: ' + e.message, 'err');
      return;
    }
    const content = data.choices?.[0]?.message?.content || '';
    out('   choices[0].message.content type: ' + typeof content);
    out('   content length: ' + content.length);
    out('   content preview: ' + JSON.stringify(content.slice(0, 200)));
    out('');

    const cleaned = content.replace(/^```json\s*|\s*```$/g, '').trim();
    out('6. AFTER REGEX CLEAN:');
    out('   ' + JSON.stringify(cleaned.slice(0, 200)));
    out('');

    try {
      const parsed = JSON.parse(cleaned);
      out('✅ PARSED OK!', 'ok');
      out('   detectedText: ' + JSON.stringify(parsed.detectedText));
      out('   translation: ' + JSON.stringify(parsed.translation));
      out('   vocabulary count: ' + (parsed.vocabulary?.length || 0));
      out('');
      out('🎉 If you see this, the GLM call works. The bug is elsewhere in Roamly.', 'ok');
    } catch (e) {
      out('❌ JSON.parse of content failed: ' + e.message, 'err');
      out('   This is the bug — GLM returned content that isn\'t valid JSON.', 'err');
    }
  } catch (err) {
    const elapsed = ((performance.now() - start) / 1000).toFixed(1);
    out('');
    out('❌ FETCH FAILED after ' + elapsed + 's: ' + err.name + ' — ' + err.message, 'err');
    out('');
    out('This is the bug. Common causes:');
    if (err.name === 'TypeError' && err.message.includes('Failed to fetch')) {
      out('   → CORS BLOCKED, or network error, or request blocked by browser.', 'err');
      out('   → Open browser console (⌥⌘J) for the exact CORS error.', 'err');
    } else {
      out('   → ' + err.name + ': ' + err.message, 'err');
    }
  }
}

// Tiny synthetic test image
function makeTestImage() {
  const canvas = document.createElement('canvas');
  canvas.width = 200; canvas.height = 100;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 200, 100);
  ctx.fillStyle = '#000'; ctx.font = '24px sans-serif';
  ctx.fillText('出口 deguchi', 20, 60);
  return canvas.toDataURL('image/png');
}

document.getElementById('run').addEventListener('click', () => testGLM(makeTestImage()));
document.getElementById('upload').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => testGLM(reader.result);
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
